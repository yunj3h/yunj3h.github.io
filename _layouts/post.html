---
layout: default
---
<article>
    <h2>{{ page.title }}</h2>
    <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%Y년 %m월 %d일" }}
    </time>
    <div class="post-content">
        {{ content }}
    </div>
</article>
<p><a href="{{ '/' | relative_url }}">← 홈으로 돌아가기</a></p>
