<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <header class="box-header">
        <h1>{{ site.title }} (Header 영역)</h1>
    </header>

    <main class="box-main">
        {{ content }}
    </main>

    <footer class="box-footer">
        <p>&copy; {{ site.time | date: "%Y" }} Footer 영역</p>
    </footer>
</body>
</html>
