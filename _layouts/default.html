<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <div class="diary-container">
        <!-- 날짜 네비게이션 헤더 -->
        <header class="diary-header">
            <!-- 추후 이전/다음 날짜 이동 기능 확장 가능 영역 -->
            <button class="nav-btn" title="이전 날짜">◀</button>
            <h1 class="current-date">{{ site.time | date: "%Y년 %m월 %d일" }}</h1>
            <button class="nav-btn" title="다음 날짜">▶</button>
        </header>

        <!-- 메인 다이어리 피드 영역 -->
        <main class="diary-main">
            {{ content }}
        </main>

        <footer class="diary-footer">
            <p>&copy; {{ site.time | date: "%Y" }} My Diary</p>
        </footer>
    </div>
</body>
</html>
